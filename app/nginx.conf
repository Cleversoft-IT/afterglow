server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # We sit behind Coolify + Traefik on https://app.../:443 — never expose
    # the internal listen port in Location headers. Without these, nginx
    # builds absolute redirects from $server_port (3000) and the request
    # scheme (http), and the browser then "navigates" the URL bar to
    # http://app.../:3000/<path>/ even though the body comes from the
    # SPA fallback. absolute_redirect off keeps redirects relative so the
    # browser preserves the current scheme/host/port; port_in_redirect
    # off is belt-and-braces in case any future block re-enables absolute
    # redirects.
    absolute_redirect off;
    port_in_redirect off;

    # Demo site embeds this app in an iframe. Allow the demo origin (and
    # same-origin) — block everyone else from framing the app.
    add_header Content-Security-Policy "frame-ancestors https://demo.afterglow.cleversoft.it https://afterglow.cleversoft.it 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_expo/ {
        # Hashed asset filenames — cache aggressively.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Expo's static output already emits HTML for every route; fall back
        # to the bundled index for unknown paths so deep links work.
        try_files $uri $uri/ $uri.html /index.html;
    }
}
