server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Demo site embeds this app in an iframe. Allow the demo origin (and
    # same-origin) — block everyone else from framing the app.
    add_header Content-Security-Policy "frame-ancestors https://demo.95-179-245-107.sslip.io https://95-179-245-107.sslip.io 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_expo/ {
        # Hashed asset filenames — cache aggressively.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Expo's static output already emits HTML for every route; fall back
        # to the bundled index for unknown paths so deep links work.
        try_files $uri $uri/ $uri.html /index.html;
    }
}
