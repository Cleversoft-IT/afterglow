services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: afterglow
      POSTGRES_PASSWORD: afterglow
      POSTGRES_DB: afterglow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterglow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://afterglow:afterglow@postgres:5432/afterglow
      AUDIO_STORAGE_DIR: /var/data/audio
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/var/data/audio
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # The Expo app and the demo site run locally with their own dev servers
  # (npm --prefix app run web → :8081, npm --prefix demo-site run dev → :5173).
  # Production deploys them as separate Coolify apps; the compose file does
  # not replicate those containers to avoid build-time overhead during dev.

volumes:
  pgdata:
  audio_data:
