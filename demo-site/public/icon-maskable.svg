<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="afterglow-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (no rounded corners) so Android can mask
       the icon into any shape (circle, squircle, square) and iOS can
       paint its standard rounded square over an opaque fill. Glyph
       lives inside the 80% safe-zone the maskable spec requires. -->
  <rect width="512" height="512" fill="url(#afterglow-grad-mask)"/>
  <text x="50%" y="50%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="280" font-weight="800" font-style="italic" fill="#ffffff" text-anchor="middle" dominant-baseline="central">a</text>
</svg>
