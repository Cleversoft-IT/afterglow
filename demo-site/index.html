<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afterglow — AI for what happens after the call</title>
    <meta name="description" content="Afterglow turns the seconds after a phone call into structured data, customer memory, and autonomously executed actions." />
    <link rel="icon" type="image/svg+xml" href="/icon-source.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="application-name" content="Afterglow" />
    <meta name="apple-mobile-web-app-title" content="Afterglow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('afterglow.demo.theme_mode');
          var resolved =
            m === 'light' ? 'light' :
            m === 'dark'  ? 'dark'  :
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = resolved;
        } catch (_) { /* no-op */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
